
<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>SuperBoard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <main>
        <h1>SuperBoard</h1>
        <p>なんでも出品できるアプリ</p>

        <h2>商品を出品する</h2>

        <form id="product-form">
            <label>商品画像</label>
            <input type="file" id="image" accept="image/*" required>

            <label>商品名</label>
            <input type="text" id="product-name"
                placeholder="商品名を入力" maxlength="100" required>

            <label>価格（円）</label>
            <input type="number" id="price"
                placeholder="例：1000" min="0" required>

            <label>商品説明</label>
            <textarea id="description"
                placeholder="商品の状態や説明を入力"
                maxlength="1000" required></textarea>

            <button type="submit">出品する</button>
        </form>

        <p id="product-status"></p>

        <h2>出品中の商品</h2>
        <div class="tab-bar" role="tablist" aria-label="商品メニュー">
            <button type="button" class="tab-button" id="products-tab"
                role="tab" aria-selected="true" aria-controls="products-panel">
                商品一覧
            </button>
            <button type="button" class="tab-button" id="history-tab"
                role="tab" aria-selected="false" aria-controls="history-panel">
                購入履歴
            </button>
        </div>
        <section id="products-panel" class="tab-panel"
            role="tabpanel" aria-labelledby="products-tab">
            <section id="products"></section>
            <section id="product-detail" hidden>
                <button type="button" id="back-to-products">商品一覧に戻る</button>
                <article id="product-detail-content" class="message product"></article>
                <form id="purchase-form" hidden>
                    <label for="buyer-name">購入者名</label>
                    <input type="text" id="buyer-name"
                        placeholder="購入者名を入力" maxlength="30" required>
                    <button type="submit">購入する</button>
                </form>
                <p id="purchase-status" role="status"></p>
                <h3>コメント</h3>
                <section id="product-comments"></section>
                <form id="product-comment-form">
                    <label for="comment-name">名前</label>
                    <input type="text" id="comment-name"
                        maxlength="30" placeholder="名前を入力" required>
                    <label for="product-comment">コメント</label>
                    <textarea id="product-comment" maxlength="300"
                        placeholder="商品についてコメント" required></textarea>
                    <button type="submit">コメントする</button>
                </form>
                <p id="comment-status" role="status"></p>
            </section>
        </section>
        <section id="history-panel" class="tab-panel"
            role="tabpanel" aria-labelledby="history-tab" hidden>
            <p>購入時と同じ購入者名を入力して履歴を表示してください。</p>
            <label for="history-buyer-name">購入者名</label>
            <input type="text" id="history-buyer-name"
                placeholder="購入者名を入力" maxlength="30">
            <button type="button" id="load-history">履歴を表示</button>
            <p id="history-status" role="status"></p>
            <section id="purchase-history"></section>
        </section>

        <hr>

        <h2>掲示板</h2>
        <form id="form">
            <input id="name" maxlength="30"
                placeholder="Nickname" required>
            <textarea id="message" maxlength="300"
                placeholder="Message" required></textarea>
            <button type="submit">投稿</button>
        </form>

        <p id="status"></p>
        <section id="messages"></section>
    </main>

    <script src="/static/app.js"></script>
</body>

</html>
